[project]
name = "docrag"
version = "0.1.0"
description = "Document RAG with multiple chunking strategies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sbert = ["sentence-transformers>=3.0"]

[project.scripts]
docrag = "docrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
